<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>しおりノート v3</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#263243;background:#f3f4f1}*{box-sizing:border-box}body{margin:0}header{background:#294c64;color:white;padding:13px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px}header h1{font-size:19px;margin:0}button{cursor:pointer;border:1px solid #ccd4d9;background:white;border-radius:8px;padding:8px 11px;color:#263243}button:hover{background:#eef3f5}button.primary{background:#2b607a;color:white;border-color:#2b607a}.layout{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 59px)}aside{background:#fff;border-right:1px solid #ddd;padding:14px;overflow:auto}.actions{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.node{padding:7px 5px;border-radius:6px;cursor:pointer;display:flex;gap:6px;align-items:center;overflow-wrap:anywhere}.node:hover{background:#edf2f4}.node.active{background:#dcebf3;font-weight:700}.tree-group{margin-left:17px;border-left:1px solid #e1e6e9;padding-left:5px}main{padding:20px;min-width:0}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}.toolbar h2{margin:0 auto 0 0;font-size:19px}.paper{max-width:820px;margin:auto;background:repeating-linear-gradient(to bottom,#fffdf7 0px,#fffdf7 34px,#bdd4e3 35px,#fffdf7 36px);box-shadow:0 5px 24px #0001;border-left:5px solid #d77d79;min-height:65vh;padding:24px 24px 24px 42px}.paper textarea{width:100%;min-height:57vh;resize:vertical;background:transparent;border:0;outline:none;font:18px/36px system-ui,sans-serif;color:#273440;padding:0;display:block}.muted{color:#697782;font-size:13px}.empty{max-width:650px;margin:80px auto;text-align:center;color:#667}.tag{font-size:12px;background:#e8f0f4;border-radius:5px;padding:5px 8px}.footer{display:flex;justify-content:center;gap:10px;align-items:center;margin:15px}.bookmarks{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}.hidden{display:none}@media(max-width:650px){.layout{display:block}aside{border-right:0;border-bottom:1px solid #ddd;max-height:38vh;overflow:auto}main{padding:10px}.paper{padding:16px 12px 16px 22px}.paper textarea{font-size:16px}.toolbar h2{width:100%}}
/* The ruling belongs to the editable text surface, so scrolling and text stay in sync. */
.paper{background:#fffdf7;padding-top:24px;padding-bottom:24px}
.paper textarea{line-height:36px;background-color:transparent;background-image:repeating-linear-gradient(to bottom,transparent 0px,transparent 34px,#bdd4e3 34px,#bdd4e3 35px,transparent 35px,transparent 36px);background-attachment:local;background-size:100% 36px;min-height:57vh;resize:vertical;overflow:auto;white-space:pre-wrap}
.move-panel{border-top:1px solid #e1e6e9;padding-top:12px;margin-top:10px;display:flex;flex-direction:column;gap:7px}
.move-panel select{width:100%;padding:9px;border:1px solid #ccd4d9;border-radius:8px;background:#fff;color:#263243}
.move-panel button{align-self:flex-start}
@media(max-width:650px){.paper textarea{line-height:36px}}
.cover-thumb{width:37px;height:37px;object-fit:cover;border-radius:6px;flex-shrink:0;border:1px solid #ddd}.cover-panel{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0}.cover-preview{width:90px;height:100px;object-fit:cover;border-radius:7px;border:1px solid #ddd}.cover-hero{width:100%;max-width:820px;height:130px;object-fit:cover;display:block;margin:0 auto 12px;border-radius:10px}.node .node-name{min-width:0;overflow-wrap:anywhere}.cover-panel input{max-width:220px} </style></head><body><header><h1>📒 しおりノート <small style="font-size:11px;opacity:.8">v3</small></h1><div><button onclick="exportData()">バックアップ保存</button> <button onclick="document.getElementById('importFile').click()">復元</button><input type="file" id="importFile" accept="application/json" hidden onchange="importData(event)"></div></header><div class="layout"><aside><strong>📁 フォルダとノート</strong><div class="actions"><button class="primary" onclick="addFolder()">＋ フォルダ</button><button onclick="addNote()">＋ ノート</button></div><div class="muted">フォルダは最大3階層。選択したフォルダの中に作成します。</div><div id="tree" style="margin-top:12px"></div><div class="actions"><button onclick="renameSelected()">名前変更</button><button onclick="deleteSelected()">削除</button></div><div id="movePanel" class="move-panel"></div><div id="coverPanel" class="move-panel"></div><p class="muted">※ データはこのブラウザに保存されます。消去に備えて定期的にバックアップしてください。</p></aside><main id="editor"></main></div><script>
const KEY='shiori-note-v1';const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch{}if(!data||!Array.isArray(data.items))data={items:[],selected:null,page:0};let expanded=new Set();function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('保存に失敗しました。空き容量をご確認ください。')}}function item(id){return data.items.find(x=>x.id===id)}function depth(id){let d=0,x=item(id),seen=new Set();while(x&&x.parent){if(seen.has(x.id))break;seen.add(x.id);d++;x=item(x.parent)}return d}function children(parent){return data.items.filter(x=>x.parent===parent)}function select(id){data.selected=id;data.page=0;save();render()}function renderTree(parent,container){for(const x of children(parent)){const wrap=document.createElement('div');const row=document.createElement('div');row.className='node'+(data.selected===x.id?' active':'');if(x.cover){const pic=document.createElement('img');pic.src=x.cover;pic.className='cover-thumb';pic.alt='';row.append(pic)}else{const ico=document.createElement('span');ico.textContent=x.type==='folder'?'📁':'📓';row.append(ico)}const nm=document.createElement('span');nm.className='node-name';nm.textContent=x.name;row.append(nm);row.onclick=()=>{select(x.id);if(x.type==='folder'){expanded.has(x.id)?expanded.delete(x.id):expanded.add(x.id);render()}};wrap.append(row);if(x.type==='folder'&&expanded.has(x.id)){const nested=document.createElement('div');nested.className='tree-group';renderTree(x.id,nested);wrap.append(nested)}container.append(wrap)}}function render(){const tree=document.getElementById('tree');tree.replaceChildren();const root=document.createElement('div');root.className='node'+(data.selected===null?' active':'');root.textContent='🏠 すべてのノート';root.onclick=()=>select(null);tree.append(root);renderTree(null,tree);renderEditor();renderMoveControls();renderCoverControls()}function addFolder(){const selected=item(data.selected);const parent=selected?.type==='folder'?selected.id:selected?.parent??null;if(parent&&depth(parent)>=2)return alert('フォルダは最大3階層までです。');const name=prompt('新しいフォルダ名','新しいフォルダ');if(!name?.trim())return;const x={id:uid(),type:'folder',name:name.trim(),parent};data.items.push(x);expanded.add(parent);data.selected=x.id;save();render()}function addNote(){const selected=item(data.selected);const parent=selected?.type==='folder'?selected.id:selected?.parent??null;const name=prompt('新しいノート名','新しいノート');if(!name?.trim())return;const x={id:uid(),type:'note',name:name.trim(),parent,pages:[{text:'',bookmark:false}]};data.items.push(x);expanded.add(parent);data.selected=x.id;data.page=0;save();render()}function renameSelected(){const x=item(data.selected);if(!x)return alert('フォルダまたはノートを選択してください。');const name=prompt('新しい名前',x.name);if(!name?.trim())return;x.name=name.trim();save();render()}function deleteSelected(){const x=item(data.selected);if(!x)return;const ids=new Set([x.id]);let changed=true;while(changed){changed=false;for(const y of data.items)if(ids.has(y.parent)&&!ids.has(y.id)){ids.add(y.id);changed=true}}if(!confirm('「'+x.name+'」とその中身を削除しますか？ この操作は取り消せません。'))return;data.items=data.items.filter(y=>!ids.has(y.id));data.selected=null;data.page=0;save();render()}function renderEditor(){const host=document.getElementById('editor');host.replaceChildren();const x=item(data.selected);if(!x||x.type==='folder'){host.innerHTML='<div class="empty"><h2>📖 しおりノートへようこそ</h2><p>左のフォルダを選んで「＋ ノート」を押すと、ノートを作れます。</p><p>大学ノート風のページに文字を書いてみよう！</p></div>';if(x?.cover){const im=document.createElement('img');im.className='cover-hero';im.src=x.cover;im.alt='フォルダの表紙';host.prepend(im)}return}if(!Array.isArray(x.pages)||!x.pages.length)x.pages=[{text:'',bookmark:false}];data.page=Math.min(data.page,x.pages.length-1);const p=x.pages[data.page];const bar=document.createElement('div');bar.className='toolbar';const title=document.createElement('h2');title.textContent='📓 '+x.name;bar.append(title);const bookmark=document.createElement('button');bookmark.textContent=p.bookmark?'🔖 しおりを外す':'☆ しおりを付ける';bookmark.onclick=()=>{p.bookmark=!p.bookmark;save();renderEditor()};bar.append(bookmark);const add=document.createElement('button');add.textContent='＋ ページ追加';add.onclick=()=>{x.pages.push({text:'',bookmark:false});data.page=x.pages.length-1;save();renderEditor()};bar.append(add);const del=document.createElement('button');del.textContent='ページ削除';del.onclick=()=>{if(x.pages.length===1)return alert('最後の1ページは削除できません。');if(!confirm('このページを削除しますか？'))return;x.pages.splice(data.page,1);data.page=Math.max(0,data.page-1);save();renderEditor()};bar.append(del);host.append(bar);if(x.cover){const im=document.createElement('img');im.className='cover-hero';im.src=x.cover;im.alt='ノートの表紙';host.append(im)}const links=document.createElement('div');links.className='bookmarks';x.pages.forEach((pg,i)=>{if(!pg.bookmark)return;const b=document.createElement('button');b.className='tag';b.textContent='🔖 '+(i+1)+'ページ';b.onclick=()=>{data.page=i;save();renderEditor()};links.append(b)});host.append(links);const paper=document.createElement('div');paper.className='paper';const area=document.createElement('textarea');area.setAttribute('aria-label','ノート本文');area.placeholder='ここにメモを書いてね…';area.value=p.text||'';area.oninput=()=>{p.text=area.value;save()};paper.append(area);host.append(paper);const footer=document.createElement('div');footer.className='footer';const prev=document.createElement('button');prev.textContent='← 前のページ';prev.disabled=data.page===0;prev.onclick=()=>{data.page--;save();renderEditor()};const count=document.createElement('span');count.textContent=(data.page+1)+' / '+x.pages.length+' ページ';const next=document.createElement('button');next.textContent='次のページ →';next.disabled=data.page===x.pages.length-1;next.onclick=()=>{data.page++;save();renderEditor()};footer.append(prev,count,next);host.append(footer)}function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='shiori-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function importData(ev){const f=ev.target.files?.[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.items))throw Error('形式が違います');if(!confirm('現在のデータをバックアップ内容で置き換えますか？'))return;data={items:d.items,selected:null,page:0};save();render();alert('復元しました')}catch(e){alert('復元できませんでした: '+e.message)}finally{ev.target.value=''}}
function folderLevel(id){if(id===null)return 0;let n=0,cur=item(id),seen=new Set();while(cur){if(seen.has(cur.id))return 99;seen.add(cur.id);n++;cur=cur.parent?item(cur.parent):null}return n}
function isInside(folderId,ancestorId){let cur=item(folderId),seen=new Set();while(cur){if(cur.id===ancestorId)return true;if(seen.has(cur.id))return true;seen.add(cur.id);cur=cur.parent?item(cur.parent):null}return false}
function subtreeFolderHeight(id){let max=1;for(const child of children(id)){if(child.type==='folder')max=Math.max(max,1+subtreeFolderHeight(child.id))}return max}
function validDestination(x,dest){if(dest===x.id)return false;if(dest!==null&&(!item(dest)||item(dest).type!=='folder'))return false;if(x.type==='folder'){if(dest!==null&&isInside(dest,x.id))return false;return folderLevel(dest)+subtreeFolderHeight(x.id)<=3}return true}
function renderMoveControls(){const panel=document.getElementById('movePanel');panel.replaceChildren();const x=item(data.selected);if(!x)return;const label=document.createElement('strong');label.textContent='📦 移動先フォルダ';panel.append(label);const selectBox=document.createElement('select');selectBox.setAttribute('aria-label','移動先フォルダ');const destinations=[{id:null,name:'🏠 最上位（すべてのノート）'},...data.items.filter(y=>y.type==='folder').map(y=>({id:y.id,name:'　'.repeat(folderLevel(y.id)-1)+'📁 '+y.name}))];let available=0;for(const dest of destinations){if(!validDestination(x,dest.id))continue;const opt=document.createElement('option');opt.value=dest.id===null?'__root__':dest.id;opt.textContent=dest.name;opt.selected=x.parent===dest.id;selectBox.append(opt);available++}panel.append(selectBox);const move=document.createElement('button');move.className='primary';move.textContent='ここに移動';move.disabled=!available;move.onclick=()=>{const dest=selectBox.value==='__root__'?null:selectBox.value;if(!validDestination(x,dest))return alert('この場所には移動できません。3階層の制限も確認してください。');if(x.parent===dest)return alert('すでにこのフォルダにあります。');x.parent=dest;if(dest)expanded.add(dest);save();render()};panel.append(move);const hint=document.createElement('span');hint.className='muted';hint.textContent='ノートもフォルダも後から移動できます。移動しても本文は残ります。';panel.append(hint)}
function renderCoverControls(){const panel=document.getElementById('coverPanel');panel.replaceChildren();const x=item(data.selected);if(!x)return;const heading=document.createElement('strong');heading.textContent='🖼️ 表紙の写真';panel.append(heading);if(x.cover){const preview=document.createElement('img');preview.src=x.cover;preview.className='cover-preview';preview.alt='現在の表紙';panel.append(preview)}const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.setAttribute('aria-label','表紙の写真を選ぶ');inp.onchange=async()=>{const f=inp.files?.[0];if(!f)return;if(!f.type.startsWith('image/'))return alert('画像ファイルを選んでください');try{const image=await createImageBitmap(f);const scale=Math.min(1,600/Math.max(image.width,image.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);const old=x.cover;x.cover=canvas.toDataURL('image/jpeg',.72);try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){x.cover=old;alert('保存容量が足りません。画像を減らすかバックアップしてください。');return}render()}catch(e){alert('画像を読み込めませんでした: '+e.message)}};panel.append(inp);if(x.cover){const remove=document.createElement('button');remove.textContent='表紙を削除';remove.onclick=()=>{if(!confirm('表紙の写真を削除しますか？'))return;delete x.cover;save();render()};panel.append(remove)}const note=document.createElement('span');note.className='muted';note.textContent='写真は縮小してこの端末のブラウザ内に保存します。';panel.append(note)}
render();</script></body></html>
