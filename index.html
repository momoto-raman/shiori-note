<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#345b71"><title>しおりノート v4</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f5f3;color:#253746}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:10px 13px;background:#e7edf0;color:#29485a}button.primary{background:#345f78;color:#fff}button.danger{color:#ad3f3f;background:#fceeee}.top{position:sticky;top:0;z-index:5;background:#345b71;color:#fff;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}.top strong{font-size:19px}.top button{background:#ffffff26;color:white;padding:8px}.wrap{max-width:1050px;margin:auto;padding:20px 16px 100px}.crumb{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-bottom:18px}.crumb button{background:transparent;padding:5px;color:#41657a}.heading{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}.heading h1{font-size:23px;margin:0}.heading p{font-size:13px;color:#71818b;margin:5px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:17px}.tile{min-width:0;text-align:center;cursor:pointer;position:relative}.tile .visual{height:178px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;transition:transform .15s}.tile:active .visual{transform:scale(.97)}.tile img{width:100%;height:100%;object-fit:cover}.folder-shape{width:92%;height:74%;margin-top:16px;background:#e9b95d;border-radius:9px 12px 12px 12px;box-shadow:inset 0 -7px #00000010,0 6px 12px #0002;position:relative}.folder-shape:before{content:"";position:absolute;top:-15px;left:0;width:48%;height:24px;border-radius:8px 12px 0 0;background:#e9b95d}.folder-shape img{position:absolute;inset:0;border-radius:8px;object-fit:cover}.book-shape{width:78%;height:94%;border-radius:4px 12px 12px 4px;background:linear-gradient(90deg,#274c70 0 9%,#4376a1 9% 12%,#5989b4 12%);box-shadow:5px 7px 12px #0003;display:flex;align-items:center;justify-content:center;padding:14px;color:#fff;overflow:hidden;position:relative}.book-shape:after{content:"";position:absolute;inset:9px;border:1px solid #ffffff65;border-radius:2px 8px 8px 2px;pointer-events:none}.book-shape img{position:absolute;inset:0}.book-shape span{z-index:1;max-height:110px;overflow:hidden;overflow-wrap:anywhere;font-weight:700;text-shadow:0 1px 2px #0006}.tile-label{font-size:14px;font-weight:600;margin-top:9px;overflow-wrap:anywhere}.tile .more{position:absolute;top:7px;right:5px;background:#fffdf4ed;border-radius:100px;padding:4px 9px;z-index:2;box-shadow:0 2px 8px #0002}.empty{text-align:center;color:#74838c;margin:75px auto}.empty .emoji{font-size:54px}.panel{background:#fff;border-radius:18px;padding:17px;box-shadow:0 4px 18px #0000000c}.cover-large{height:310px;width:225px;max-width:80%;margin:10px auto 20px;border-radius:5px 15px 15px 5px;overflow:hidden;background:linear-gradient(90deg,#284e73 0 10%,#477ca9 10% 13%,#6496bf 13%);box-shadow:8px 9px 20px #0003;display:flex;align-items:center;justify-content:center;color:white;text-align:center;padding:25px;font-size:23px;font-weight:700}.cover-large img{height:100%;width:100%;object-fit:cover}.cover-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.paper{max-width:820px;margin:auto;background:#fffdf7;border-left:5px solid #d77d79;box-shadow:0 5px 24px #0001;padding:20px 18px 20px 32px}.paper textarea{width:100%;min-height:57vh;resize:vertical;background-color:transparent;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 34px,#bdd4e3 34px,#bdd4e3 35px,transparent 35px,transparent 36px);background-size:100% 36px;background-attachment:local;border:0;outline:none;font:18px/36px system-ui,sans-serif;padding:0;color:#273440;display:block}.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}.toolbar h2{margin:0 auto 0 0;font-size:19px}.footer{display:flex;justify-content:center;align-items:center;gap:10px;margin:15px}.bookmarks{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}.modal-back{position:fixed;inset:0;background:#0008;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}.modal{background:white;border-radius:18px;padding:22px;width:min(420px,100%);max-height:85vh;overflow:auto}.modal h2{margin-top:0}.modal button{margin:5px 5px 0 0}.modal input,.modal select{width:100%;padding:11px;border:1px solid #cbd5dc;border-radius:9px;margin:8px 0}.muted{font-size:13px;color:#6f7e88}.hidden{display:none}@media(max-width:600px){.wrap{padding:15px 12px 85px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.tile .visual{height:160px}.heading h1{font-size:20px}.paper{padding:16px 12px 16px 22px}.paper textarea{font-size:16px}}
</style></head><body><div class="top"><strong>📒 しおりノート <small style="font-size:11px;opacity:.8">v4</small></strong><button onclick="showBackup()">⚙️ 保存・復元</button></div><main class="wrap" id="app"></main><input type="file" id="importFile" accept="application/json" hidden onchange="importData(event)"><input type="file" id="coverFile" accept="image/*" hidden><div id="modalHost"></div><script>
const KEY='shiori-note-v1';const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch{}if(!data||!Array.isArray(data.items))data={items:[],selected:null,page:0};let expanded=new Set();function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('保存に失敗しました。空き容量をご確認ください。')}}function item(id){return data.items.find(x=>x.id===id)}function depth(id){let d=0,x=item(id),seen=new Set();while(x&&x.parent){if(seen.has(x.id))break;seen.add(x.id);d++;x=item(x.parent)}return d}function children(parent){return data.items.filter(x=>x.parent===parent)}function select(id){data.selected=id;data.page=0;save();render()}
function folderLevel(id){if(id===null)return 0;let n=0,cur=item(id),seen=new Set();while(cur){if(seen.has(cur.id))return 99;seen.add(cur.id);n++;cur=cur.parent?item(cur.parent):null}return n}
function isInside(folderId,ancestorId){let cur=item(folderId),seen=new Set();while(cur){if(cur.id===ancestorId)return true;if(seen.has(cur.id))return true;seen.add(cur.id);cur=cur.parent?item(cur.parent):null}return false}
function subtreeFolderHeight(id){let max=1;for(const child of children(id)){if(child.type==='folder')max=Math.max(max,1+subtreeFolderHeight(child.id))}return max}
function validDestination(x,dest){if(dest===x.id)return false;if(dest!==null&&(!item(dest)||item(dest).type!=='folder'))return false;if(x.type==='folder'){if(dest!==null&&isInside(dest,x.id))return false;return folderLevel(dest)+subtreeFolderHeight(x.id)<=3}return true}

function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='shiori-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function importData(ev){const f=ev.target.files?.[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.items))throw Error('形式が違います');if(!confirm('現在のデータをバックアップ内容で置き換えますか？'))return;data={items:d.items,selected:null,page:0};save();render();alert('復元しました')}catch(e){alert('復元できませんでした: '+e.message)}finally{ev.target.value=''}}


let locationId=null,screen='folder';
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function button(label,fn,cls=''){const b=el('button',cls,label);b.onclick=fn;return b}
function openFolder(id){locationId=id;screen='folder';render()}
function openNote(id){data.selected=id;data.page=0;screen='cover';save();render()}
function crumbs(host){const nav=el('nav','crumb');nav.append(button('🏠 ホーム',()=>openFolder(null)));let chain=[],cur=item(locationId);while(cur){chain.unshift(cur);cur=cur.parent?item(cur.parent):null}chain.forEach(f=>{nav.append(el('span','', '›'));nav.append(button(f.name,()=>openFolder(f.id)))});host.append(nav)}
function render(){const host=document.getElementById('app');host.replaceChildren();if(screen==='editor')return renderEditorNew(host);if(screen==='cover')return renderCoverNew(host);crumbs(host);const heading=el('div','heading'),left=el('div');left.append(el('h1','',locationId?item(locationId)?.name||'フォルダ':'マイノート'));left.append(el('p','',locationId?'フォルダの中身':'フォルダをタップして中へ進めます'));heading.append(left);const acts=el('div','actions');if(!locationId||folderLevel(locationId)<3)acts.append(button('📁 フォルダ作成',()=>createItem('folder'),'primary'));acts.append(button('📒 ノート作成',()=>createItem('note'),'primary'));if(locationId)acts.append(button('•••',()=>showOptions(item(locationId))));heading.append(acts);host.append(heading);const entries=children(locationId).slice().sort((a,b)=>(a.type==='folder'?0:1)-(b.type==='folder'?0:1));if(!entries.length){const empty=el('div','empty');empty.append(el('div','emoji','📚'));empty.append(el('p','','まだ何もありません。上のボタンから作成しよう！'));host.append(empty);return}const grid=el('div','grid');entries.forEach(x=>{const tile=el('div','tile');tile.setAttribute('role','button');tile.tabIndex=0;const visual=el('div','visual');if(x.type==='folder'){const folder=el('div','folder-shape');if(x.cover){const im=el('img');im.src=x.cover;im.alt='';folder.append(im)}visual.append(folder)}else{const book=el('div','book-shape');if(x.cover){const im=el('img');im.src=x.cover;im.alt='';book.append(im)}else book.append(el('span','',x.name));visual.append(book)}tile.append(visual,el('div','tile-label',x.name));const more=button('•••',()=>showOptions(x),'more');more.setAttribute('aria-label',x.name+'の設定');tile.append(more);visual.onclick=()=>x.type==='folder'?openFolder(x.id):openNote(x.id);tile.onkeydown=e=>{if(e.target===tile&&(e.key==='Enter'||e.key===' ')){e.preventDefault();visual.click()}};grid.append(tile)});host.append(grid)}
function createItem(type){if(type==='folder'&&locationId&&folderLevel(locationId)>=3)return alert('フォルダは3階層までです。');const name=prompt(type==='folder'?'フォルダ名':'ノート名',type==='folder'?'新しいフォルダ':'新しいノート');if(!name?.trim())return;const x={id:uid(),type,name:name.trim(),parent:locationId};if(type==='note')x.pages=[{text:'',bookmark:false}];data.items.push(x);save();render()}
function showModal(title,build){const bg=el('div','modal-back'),panel=el('div','modal');panel.append(el('h2','',title));build(panel,()=>bg.remove());bg.append(panel);bg.onclick=e=>{if(e.target===bg)bg.remove()};document.getElementById('modalHost').replaceChildren(bg)}
function showOptions(x){showModal(x.name,(p,close)=>{p.append(button('✏️ 名前変更',()=>{close();const name=prompt('新しい名前',x.name);if(name?.trim()){x.name=name.trim();save();render()}}));p.append(button('🖼️ 表紙の写真を変更',()=>{close();chooseCover(x)}));if(x.cover)p.append(button('標準の表紙に戻す',()=>{delete x.cover;save();close();render()}));p.append(button('📦 別のフォルダへ移動',()=>{close();showMove(x)}));p.append(button('🗑️ 削除',()=>{close();removeItem(x)},'danger'));p.append(button('閉じる',close))})}
function chooseCover(x){const input=document.getElementById('coverFile');input.value='';input.onchange=async()=>{const f=input.files?.[0];if(!f)return;try{const image=await createImageBitmap(f);const scale=Math.min(1,640/Math.max(image.width,image.height));const canvas=document.createElement('canvas');canvas.width=Math.round(image.width*scale);canvas.height=Math.round(image.height*scale);canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);const old=x.cover;x.cover=canvas.toDataURL('image/jpeg',.7);try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){x.cover=old;alert('画像の保存容量が足りません。バックアップしてから写真を減らしてください。');return}render()}catch(e){alert('画像を読み込めませんでした: '+e.message)}};input.click()}
function showMove(x){showModal('移動先を選択',(p,close)=>{p.append(el('p','muted','ノートやフォルダを後から移動できます。'));const sel=el('select');const destinations=[{id:null,name:'🏠 ホーム'},...data.items.filter(y=>y.type==='folder').map(y=>({id:y.id,name:'　'.repeat(folderLevel(y.id)-1)+'📁 '+y.name}))];for(const d of destinations){if(!validDestination(x,d.id))continue;const opt=el('option','',d.name);opt.value=d.id??'__root__';opt.selected=x.parent===d.id;sel.append(opt)}p.append(sel);p.append(button('ここへ移動',()=>{const dest=sel.value==='__root__'?null:sel.value;if(!validDestination(x,dest))return alert('この場所には移動できません');x.parent=dest;save();close();if(x.type==='folder'&&locationId===x.id)locationId=dest;render()},'primary'));p.append(button('キャンセル',close))})}
function removeItem(x){if(!confirm('「'+x.name+'」と中身を削除しますか？ 元に戻せません。'))return;const ids=new Set([x.id]);let changed=true;while(changed){changed=false;for(const y of data.items)if(ids.has(y.parent)&&!ids.has(y.id)){ids.add(y.id);changed=true}}data.items=data.items.filter(y=>!ids.has(y.id));if(locationId&&ids.has(locationId))locationId=null;if(data.selected&&ids.has(data.selected)){data.selected=null;screen='folder'}save();render()}
function renderCoverNew(host){const x=item(data.selected);if(!x){screen='folder';return render()}host.append(button('← フォルダへ戻る',()=>{locationId=x.parent;screen='folder';render()}));const p=el('div','panel');p.style.marginTop='14px';p.style.textAlign='center';p.append(el('h1','',x.name));const cover=el('div','cover-large');if(x.cover){const img=el('img');img.src=x.cover;img.alt='ノートの表紙';cover.append(img)}else cover.append(el('span','',x.name));p.append(cover);const actions=el('div','cover-actions');actions.append(button('📖 ノートを開く',()=>{screen='editor';render()},'primary'));actions.append(button('🖼️ 表紙を変更',()=>chooseCover(x)));actions.append(button('••• その他',()=>showOptions(x)));p.append(actions);host.append(p)}
function renderEditorNew(host){const x=item(data.selected);if(!x||x.type!=='note'){screen='folder';return render()}if(!x.pages?.length)x.pages=[{text:'',bookmark:false}];data.page=Math.max(0,Math.min(data.page,x.pages.length-1));const p=x.pages[data.page];host.append(button('← 表紙へ戻る',()=>{screen='cover';render()}));const bar=el('div','toolbar');bar.style.marginTop='15px';bar.append(el('h2','',x.name));bar.append(button(p.bookmark?'🔖 しおりを外す':'☆ しおりを付ける',()=>{p.bookmark=!p.bookmark;save();render()}));bar.append(button('＋ ページ追加',()=>{x.pages.push({text:'',bookmark:false});data.page=x.pages.length-1;save();render()}));bar.append(button('ページ削除',()=>{if(x.pages.length===1)return alert('最後のページは削除できません');if(confirm('このページを削除しますか？')){x.pages.splice(data.page,1);data.page=Math.max(0,data.page-1);save();render()}}));host.append(bar);const links=el('div','bookmarks');x.pages.forEach((pg,i)=>{if(pg.bookmark)links.append(button('🔖 '+(i+1)+'ページ',()=>{data.page=i;save();render()}))});host.append(links);const paper=el('div','paper');const area=el('textarea');area.setAttribute('aria-label','ノート本文');area.placeholder='ここにメモを書いてね…';area.value=p.text||'';area.oninput=()=>{p.text=area.value;save()};paper.append(area);host.append(paper);const footer=el('div','footer');const prev=button('← 前',()=>{data.page--;save();render()});prev.disabled=data.page===0;const next=button('次 →',()=>{data.page++;save();render()});next.disabled=data.page===x.pages.length-1;footer.append(prev,el('span','',(data.page+1)+' / '+x.pages.length+' ページ'),next);host.append(footer)}
function showBackup(){showModal('保存と復元',(p,close)=>{p.append(el('p','muted','データはこの端末のブラウザ内に保存されます。定期的にバックアップしてください。'));p.append(button('⬇️ バックアップ保存',()=>{exportData();close()}));p.append(button('⬆️ バックアップ復元',()=>{close();document.getElementById('importFile').click()}));p.append(button('閉じる',close))})}
render();
</script></body></html>
